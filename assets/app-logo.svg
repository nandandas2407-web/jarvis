<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="core" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7ef9ff"/>
      <stop offset="45%" stop-color="#00d4ff"/>
      <stop offset="100%" stop-color="#0072ff" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="ring" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00e5ff"/>
      <stop offset="100%" stop-color="#0057ff"/>
    </linearGradient>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#0a0e17"/>
      <stop offset="100%" stop-color="#000000"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="2.2" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- background -->
  <circle cx="32" cy="32" r="31" fill="url(#bg)"/>
  <circle cx="32" cy="32" r="31" fill="none" stroke="#1a2333" stroke-width="1"/>

  <!-- outer rotating ring segments (arc reactor style) -->
  <g filter="url(#glow)">
    <circle cx="32" cy="32" r="24" fill="none" stroke="url(#ring)" stroke-width="1.4" stroke-dasharray="6 4" opacity="0.55"/>
    <circle cx="32" cy="32" r="18" fill="none" stroke="url(#ring)" stroke-width="1.6" stroke-dasharray="10 3" opacity="0.8"/>
  </g>

  <!-- inner glowing core -->
  <circle cx="32" cy="32" r="11" fill="url(#core)" filter="url(#glow)"/>
  <circle cx="32" cy="32" r="6.5" formal="#eafcff" fill="#eafcff"/>
  <circle cx="32" cy="32" r="6.5" fill="none" stroke="#00e5ff" stroke-width="1"/>

  <!-- orbit nodes -->
  <circle cx="32" cy="8" r="1.8" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="56" cy="32" r="1.8" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="32" cy="56" r="1.8" fill="#00e5ff" filter="url(#glow)"/>
  <circle cx="8" cy="32" r="1.8" fill="#00e5ff" filter="url(#glow)"/>
</svg>
